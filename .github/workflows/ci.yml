name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $hasErrors = $false
          foreach ($file in @('scripts/text-ai-doctor.ps1', 'scripts/text-ai-setup.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $hasErrors = $true
              Write-Host "PowerShell parse errors in $file" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }

          if ($hasErrors) {
            exit 1
          }
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
